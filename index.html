<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting... | Harbour & Hills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=hk/index.html">
    <script type="text/javascript">
        // Basic browser language-based client-side redirection
        try {
            var lang = (navigator.language || navigator.userLanguage).toLowerCase();
            if (lang.indexOf('ca') !== -1) {
                window.location.href = "ca/index.html";
            } else if (lang.indexOf('in') !== -1) {
                window.location.href = "in/index.html";
            } else if (lang.indexOf('hk') !== -1 || lang.indexOf('zh') !== -1) {
                window.location.href = "hk/index.html";
            } else {
                window.location.href = "hk/index.html";
            }
        } catch (e) {
            window.location.href = "hk/index.html";
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        a {
            color: #1dbab0;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
        <p>Redirecting to your regional Harbour & Hills page...</p>
        <p>If you are not redirected automatically, please select: <a href="hk/index.html">Go to Hong Kong Homepage</a></p>
    </div>
</body>
</html>
